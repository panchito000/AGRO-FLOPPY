<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iniciar sesión — AgroFloppy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body data-page="login">
  <main class="auth-page">
    <div class="auth-card card">
      <a href="/" class="logo auth-card__logo">
        <img src="assets/logo.png" alt="AgroFloppy" class="logo__icon" width="40" height="40">
        <span class="logo__text">AgroFloppy</span>
      </a>

      <h1 class="auth-card__title">Acceso al copiloto agronómico</h1>
      <p class="auth-card__subtitle" id="login-mode-hint">
        Ingresá con tu email y contraseña.
      </p>

      <form id="login-form" class="form auth-form" novalidate>
        <div class="form__group">
          <label for="email" class="form__label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form__input"
            placeholder="tu@empresa.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form__group">
          <label for="password" class="form__label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form__input"
            placeholder="Mínimo 6 caracteres"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <p id="login-success" class="auth-form__success" role="status" hidden></p>
        <p id="login-error" class="auth-form__error" role="alert" hidden></p>

        <button type="submit" class="btn btn--primary btn--block" id="btn-login">
          <span class="btn__text">Iniciar sesión</span>
          <span class="btn__loader" hidden></span>
        </button>
      </form>

      <button type="button" class="btn btn--ghost btn--block auth-card__toggle" id="btn-toggle-mode">
        ¿No tenés cuenta? Registrarse
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
